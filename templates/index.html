<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Portal - Login & Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes float-slow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, -30px); }
        }

        @keyframes float-slower {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.1); }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        @keyframes scale-in {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes particle-fade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        @keyframes gradient-x {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes ping-slow {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        @keyframes ping-slower {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes float-gentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes orbit {
            0% { transform: translate(-50%, 0) rotate(0deg) translateX(50px); }
            100% { transform: translate(-50%, 0) rotate(360deg) translateX(50px); }
        }

        @keyframes orbit-reverse {
            0% { transform: translate(-50%, 0) rotate(0deg) translateX(50px); }
            100% { transform: translate(-50%, 0) rotate(-360deg) translateX(50px); }
        }

        @keyframes orbit-diagonal {
            0% { transform: translate(0, -50%) rotate(0deg) translateY(50px); }
            100% { transform: translate(0, -50%) rotate(360deg) translateY(50px); }
        }

        @keyframes float-rotate {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .animate-float-slow { animation: float-slow 20s ease-in-out infinite; }
        .animate-float-slower { animation: float-slower 25s ease-in-out infinite; }
        .animate-pulse-slow { animation: pulse-slow 8s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }
        .animate-scale-in { animation: scale-in 0.5s ease-out; }
        .animate-shimmer { animation: shimmer 3s infinite; }
        .animate-particle-fade { animation: particle-fade 1s ease-out forwards; }
        .animate-gradient-x { background-size: 200% 100%; animation: gradient-x 3s ease infinite; }
        .animate-pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }
        .animate-spin-slow { animation: spin-slow 4s linear infinite; }
        .animate-ping-slow { animation: ping-slow 3s cubic-bezier(0, 0, 0.2, 1) infinite; }
        .animate-ping-slower { animation: ping-slower 4s cubic-bezier(0, 0, 0.2, 1) infinite; }
        .animate-float-gentle { animation: float-gentle 4s ease-in-out infinite; }
        .animate-orbit { animation: orbit 6s linear infinite; }
        .animate-orbit-reverse { animation: orbit-reverse 8s linear infinite; }
        .animate-orbit-diagonal { animation: orbit-diagonal 7s linear infinite; }
        .animate-float-rotate { animation: float-rotate 8s ease-in-out infinite; }

        .bg-grid-pattern {
            background-image:
                    linear-gradient(to right, rgba(59, 130, 246, 0.1) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: linear-gradient(to right, rgb(34, 211, 238), rgb(59, 130, 246));
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.6);
        }
    </style>
</head>
<body>
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 flex items-center justify-center p-4 overflow-hidden relative">

    <!-- Background orbs -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-10 w-96 h-96 bg-gradient-to-br from-cyan-400/30 to-blue-500/30 rounded-full blur-3xl animate-float-slow"></div>
        <div class="absolute bottom-20 right-10 w-96 h-96 bg-gradient-to-br from-indigo-400/30 to-purple-500/30 rounded-full blur-3xl animate-float-slower"></div>
        <div class="absolute top-1/2 left-1/2 w-96 h-96 bg-gradient-to-br from-teal-400/20 to-cyan-500/20 rounded-full blur-3xl animate-pulse-slow"></div>
    </div>

    <!-- Particles -->
    <div id="particles" class="absolute inset-0 pointer-events-none"></div>

    <!-- Grid pattern -->
    <div class="absolute inset-0 bg-grid-pattern opacity-10 pointer-events-none"></div>

    <!-- Floating icons -->
    <div id="floatingIcons" class="absolute inset-0 pointer-events-none"></div>

    <!-- Main card -->
    <div class="relative w-full max-w-md animate-scale-in z-10">
        <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-500 rounded-3xl blur-xl opacity-50 animate-pulse-glow"></div>

        <div class="relative bg-slate-800/90 backdrop-blur-2xl rounded-3xl shadow-2xl overflow-hidden border border-cyan-500/30">

            <!-- Header -->
            <div class="bg-gradient-to-r from-cyan-600 via-blue-600 to-indigo-600 p-8 text-white text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent animate-shimmer"></div>

                <div class="flex justify-center mb-6 relative">
                    <div class="relative group">
                        <div class="absolute inset-0 rounded-full bg-cyan-400/20 animate-ping-slow"></div>
                        <div class="absolute inset-0 rounded-full bg-blue-400/20 animate-ping-slower"></div>

                        <div class="relative bg-gradient-to-br from-cyan-400 via-blue-500 to-indigo-500 p-6 rounded-full backdrop-blur-sm shadow-2xl group-hover:scale-110 group-hover:rotate-12 transition-all duration-500 border-4 border-white/30 animate-float-gentle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="drop-shadow-2xl text-white">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                            </svg>

                            <div class="absolute top-0 left-1/2 w-3 h-3 bg-yellow-400 rounded-full -translate-x-1/2 animate-orbit shadow-lg"></div>
                            <div class="absolute bottom-0 left-1/2 w-3 h-3 bg-cyan-400 rounded-full -translate-x-1/2 animate-orbit-reverse shadow-lg"></div>
                            <div class="absolute left-0 top-1/2 w-3 h-3 bg-pink-400 rounded-full -translate-y-1/2 animate-orbit-diagonal shadow-lg"></div>
                        </div>
                    </div>
                </div>

                <h1 class="text-3xl font-bold mb-2 tracking-tight">Scholarship Portal</h1>
                <p class="text-cyan-100 text-sm">Unlock your academic potential</p>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-cyan-500/30 bg-slate-900/50">
                <button id="loginTab" onclick="switchTab(true)" class="flex-1 py-4 text-center font-bold transition-all duration-500 relative text-cyan-400 bg-slate-800/80 scale-105">
                    <div class="absolute bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-500 via-blue-500 to-cyan-500 animate-gradient-x"></div>
                    <span class="relative">Login</span>
                </button>
                <button id="signupTab" onclick="switchTab(false)" class="flex-1 py-4 text-center font-bold transition-all duration-500 relative text-slate-400 hover:text-cyan-300">
                    <span class="relative">Sign Up</span>
                </button>
            </div>

            <!-- Form -->
            <div class="p-8 space-y-5">

                <!-- Full Name -->
                <div id="fullNameField" class="space-y-2 hidden">
                    <label class="text-sm font-semibold text-cyan-300 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Full Name
                    </label>
                    <input type="text" id="fullName" class="w-full px-4 py-3 bg-slate-900/50 border-2 border-slate-600 text-white rounded-xl focus:ring-4 focus:ring-cyan-500/50 focus:border-cyan-400 transition-all outline-none placeholder-slate-500" placeholder="John Doe">
                </div>

                <!-- Email -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-cyan-300 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                        Email Address
                    </label>
                    <input type="email" id="email" class="w-full px-4 py-3 bg-slate-900/50 border-2 border-slate-600 text-white rounded-xl focus:ring-4 focus:ring-cyan-500/50 focus:border-cyan-400 transition-all outline-none placeholder-slate-500" placeholder="student@university.edu">
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-cyan-300 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Password
                    </label>
                    <div class="relative">
                        <input type="password" id="password" class="w-full px-4 py-3 bg-slate-900/50 border-2 border-slate-600 text-white rounded-xl focus:ring-4 focus:ring-cyan-500/50 focus:border-cyan-400 transition-all outline-none pr-12 placeholder-slate-500" placeholder="••••••••">
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-400 transition-all">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div id="confirmPasswordField" class="space-y-2 hidden">
                    <label class="text-sm font-semibold text-cyan-300 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Confirm Password
                    </label>
                    <input type="password" id="confirmPassword" class="w-full px-4 py-3 bg-slate-900/50 border-2 border-slate-600 text-white rounded-xl focus:ring-4 focus:ring-cyan-500/50 focus:border-cyan-400 transition-all outline-none placeholder-slate-500" placeholder="••••••••">
                </div>

                <!-- Forgot Password -->
                <div id="forgotPassword" class="text-right">
                    <button type="button" class="text-sm text-cyan-400 hover:text-cyan-300 font-semibold hover:underline transition-all">
                        Forgot Password?
                    </button>
                </div>

                <!-- Submit -->
                <button onclick="handleSubmit()" class="w-full py-4 rounded-xl text-white font-bold shadow-2xl hover:scale-105 active:scale-95 transition-all duration-300 relative overflow-hidden group bg-gradient-to-r from-cyan-600 via-blue-600 to-indigo-600 hover:from-cyan-500 hover:via-blue-500 hover:to-indigo-500">
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                    <span id="submitText" class="relative">Login</span>
                </button>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-600"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-slate-800 text-slate-400 font-medium">Or continue with</span>
                    </div>
                </div>

                <!-- Social buttons -->
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="flex items-center justify-center gap-2 px-4 py-3 bg-slate-900/50 border-2 border-slate-600 text-slate-300 rounded-xl hover:bg-slate-700/50 hover:border-cyan-500/50 transition-all hover:scale-105">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span class="text-sm font-semibold">Google</span>
                    </button>

                    <button type="button" class="flex items-center justify-center gap-2 px-4 py-3 bg-slate-900/50 border-2 border-slate-600 text-slate-300 rounded-xl hover:bg-slate-700/50 hover:border-cyan-500/50 transition-all hover:scale-105">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        <span class="text-sm font-semibold">GitHub</span>
                    </button>

                    <button type="button" class="flex items-center justify-center gap-2 px-4 py-3 bg-slate-900/50 border-2 border-slate-600 text-slate-300 rounded-xl hover:bg-slate-700/50 hover:border-cyan-500/50 transition-all hover:scale-105">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                        </svg>
                        <span class="text-sm font-semibold">Apple</span>
                    </button>

                    <button type="button" class="flex items-center justify-center gap-2 px-4 py-3 bg-slate-900/50 border-2 border-slate-600 text-slate-300 rounded-xl hover:bg-slate-700/50 hover:border-cyan-500/50 transition-all hover:scale-105">
                        <svg class="w-5 h-5" fill="#0A66C2" viewBox="0 0 24 24">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                        </svg>
                        <span class="text-sm font-semibold">LinkedIn</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center mt-6 text-sm text-slate-300 font-medium">
            <span id="footerText">Don't have an account? </span>
            <button onclick="switchTab(!isLogin)" class="font-bold text-cyan-400 hover:text-cyan-300 hover:underline transition-all" id="footerButton">
                Sign up now!
            </button>
        </p>
    </div>
</div>

<script>
    let isLogin = true;
    let showPass = false;

    // Floating icons
    const icons = [
        { svg: '<circle cx="12" cy="8" r="6"></circle><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"></path>', color: 'from-amber-400 to-orange-500', top: '15%', left: '8%' },
        { svg: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>', color: 'from-emerald-400 to-teal-500', top: '25%', left: '85%' },
        { svg: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>', color: 'from-cyan-400 to-blue-500', top: '70%', left: '10%' },
        { svg: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>', color: 'from-yellow-400 to-amber-500', top: '75%', left: '88%' }
    ];

    const container = document.getElementById('floatingIcons');
    icons.forEach((icon, i) => {
        const div = document.createElement('div');
        div.style.cssText = `position:absolute;top:${icon.top};left:${icon.left};opacity:0.4;animation:float-rotate 8s ease-in-out infinite;animation-delay:${i*0.5}s;transition:transform 0.3s`;
        div.innerHTML = `<div class="bg-gradient-to-br ${icon.color} p-3 rounded-2xl shadow-2xl"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white">${icon.svg}</svg></div>`;
        container.appendChild(div);
    });

    // Mouse tracking
    document.addEventListener('mousemove', (e) => {
        if (Math.random() > 0.95) {
            const p = document.createElement('div');
            p.className = 'particle animate-particle-fade';
            p.style.left = e.clientX + 'px';
            p.style.top = e.clientY + 'px';
            document.getElementById('particles').appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }

        const floaters = container.children;
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const ox = (e.clientX - cx) / 50;
        const oy = (e.clientY - cy) / 50;

        for (let i = 0; i < floaters.length; i++) {
            floaters[i].style.transform = `translate(${ox * (i + 1)}px, ${oy * (i + 1)}px)`;
        }
    });

    function switchTab(toLogin) {
        isLogin = toLogin;
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');

        if (toLogin) {
            loginTab.className = 'flex-1 py-4 text-center font-bold transition-all duration-500 relative text-cyan-400 bg-slate-800/80 scale-105';
            loginTab.innerHTML = '<div class="absolute bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-500 via-blue-500 to-cyan-500 animate-gradient-x"></div><span class="relative">Login</span>';
            signupTab.className = 'flex-1 py-4 text-center font-bold transition-all duration-500 relative text-slate-400 hover:text-cyan-300';
            signupTab.innerHTML = '<span class="relative">Sign Up</span>';

            document.getElementById('fullNameField').classList.add('hidden');
            document.getElementById('confirmPasswordField').classList.add('hidden');
            document.getElementById('forgotPassword').classList.remove('hidden');
            document.getElementById('submitText').textContent = 'Login';
            document.getElementById('footerText').textContent = "Don't have an account? ";
            document.getElementById('footerButton').textContent = 'Sign up now!';
        } else {
            signupTab.className = 'flex-1 py-4 text-center font-bold transition-all duration-500 relative text-cyan-400 bg-slate-800/80 scale-105';
            signupTab.innerHTML = '<div class="absolute bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-blue-500 to-indigo-500 animate-gradient-x"></div><span class="relative">Sign Up</span>';
            loginTab.className = 'flex-1 py-4 text-center font-bold transition-all duration-500 relative text-slate-400 hover:text-cyan-300';
            loginTab.innerHTML = '<span class="relative">Login</span>';

            document.getElementById('fullNameField').classList.remove('hidden');
            document.getElementById('confirmPasswordField').classList.remove('hidden');
            document.getElementById('forgotPassword').classList.add('hidden');
            document.getElementById('submitText').textContent = 'Create Account';
            document.getElementById('footerText').textContent = 'Already have an account? ';
            document.getElementById('footerButton').textContent = 'Login here!';
        }
    }

    function togglePassword() {
        showPass = !showPass;
        const passField = document.getElementById('password');
        const confirmField = document.getElementById('confirmPassword');
        const icon = document.getElementById('eyeIcon');

        passField.type = showPass ? 'text' : 'password';
        if (confirmField) confirmField.type = showPass ? 'text' : 'password';

        icon.innerHTML = showPass
            ? '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" x2="22" y1="2" y2="22"></line>'
            : '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>';
    }

    async function handleSubmit() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            alert("Please fill in all required fields");
            return;
        }

        // SIGNUP validations
        let fullName = "";
        if (!isLogin) {
            fullName = document.getElementById("fullName").value.trim();
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!fullName) {
                alert("Please enter your full name");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }
        }

        // API endpoint
        const url = isLogin
            ? "http://127.0.0.1:8000/api/auth/login/"
            : "http://127.0.0.1:8000/api/auth/signup/";

        // Payload
        const payload = isLogin
            ? { email, password }
            : { email, password, full_name: fullName };

        try {
            const res = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            // If backend returns error
            if (!res.ok) {
                alert(data.error || "Something went wrong");
                return;
            }

            // Save token
            if (data.token) {
                localStorage.setItem("token", data.token);
            }

            alert(isLogin ? "✅ Login successful!" : "✅ Account created successfully!");

            // Redirect after success
            window.location.href = "/dashboard/";

        } catch (err) {
            console.error(err);
            alert("Server not reachable. Check if Django is running.");
        }
    }
</script>
