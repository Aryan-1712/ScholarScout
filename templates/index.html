<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarScout - Find Your Perfect Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        .animate-float { animation: float-slow 6s ease-in-out infinite; }
        .animate-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        .animate-slideIn { animation: slideIn 0.3s ease-out; }

        .scholarship-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .scholarship-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(34, 211, 238, 0.3);
        }

        .filter-badge {
            transition: all 0.2s ease;
        }

        .filter-badge:hover {
            transform: scale(1.05);
        }

        .bg-grid {
            background-image:
                    linear-gradient(to right, rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .tooltip {
            position: relative;
        }

        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            white-space: nowrap;
            font-size: 12px;
            z-index: 1000;
            margin-bottom: 8px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 text-white min-h-screen">

<div id="authPage" class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-slate-800/40 backdrop-blur-2xl border border-cyan-500/30 rounded-3xl p-8 shadow-2xl animate-fadeIn">
        <div class="flex flex-col items-center mb-8">
            <div class="bg-gradient-to-br from-cyan-400 to-blue-500 p-3 rounded-2xl mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">ScholarScout</h1>
            <p id="authSubtitle" class="text-slate-400 mt-2">Welcome back, Scholar!</p>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-5">
            <div id="nameField" class="hidden">
                <label class="text-xs font-semibold text-cyan-300 uppercase tracking-wider ml-1">Full Name</label>
                <input type="text" id="authName" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-cyan-500 outline-none transition-all" placeholder="John Doe">
            </div>

            <div>
                <label class="text-xs font-semibold text-cyan-300 uppercase tracking-wider ml-1">Email Address</label>
                <input type="email" required id="authEmail" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-cyan-500 outline-none transition-all" placeholder="name@college.edu">
            </div>

            <div>
                <label class="text-xs font-semibold text-cyan-300 uppercase tracking-wider ml-1">Password</label>
                <input type="password" required id="authPass" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-cyan-500 outline-none transition-all" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 rounded-xl font-bold text-white shadow-lg shadow-cyan-500/20 transform transition-all active:scale-95">
                <span id="btnText">Sign In</span>
            </button>
        </form>

        <div class="mt-6 text-center">
            <button onclick="toggleAuthMode()" id="toggleBtn" class="text-sm text-slate-400 hover:text-cyan-300 transition-colors">
                Don't have an account? <span class="text-cyan-400 font-bold">Sign Up</span>
            </button>
        </div>
    </div>
</div>

<div id="dashboardPage" class="hidden">
</div>

<script>
    let isLoginMode = true;

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        const nameField = document.getElementById('nameField');
        const btnText = document.getElementById('btnText');
        const authSubtitle = document.getElementById('authSubtitle');
        const toggleBtn = document.getElementById('toggleBtn');

        if (isLoginMode) {
            nameField.classList.add('hidden');
            btnText.innerText = 'Sign In';
            authSubtitle.innerText = 'Welcome back, Scholar!';
            toggleBtn.innerHTML = 'Don\'t have an account? <span class="text-cyan-400 font-bold">Sign Up</span>';
        } else {
            nameField.classList.remove('hidden');
            btnText.innerText = 'Create Account';
            authSubtitle.innerText = 'Start your journey today.';
            toggleBtn.innerHTML = 'Already have an account? <span class="text-cyan-400 font-bold">Sign In</span>';
        }
    }

    function handleAuth(event) {
        event.preventDefault();

        // Mocking a successful login
        const email = document.getElementById('authEmail').value;
        const name = document.getElementById('authName').value || "Scholar";

        // Simple animation/transition logic
        document.getElementById('authPage').classList.add('opacity-0');

        setTimeout(() => {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            // Update the Dashboard Name
            const userDisplay = document.querySelector('.text-sm.font-semibold.text-white');
            if(userDisplay) userDisplay.innerText = name;

            // Re-initialize your scholarship scripts here
            init();
        }, 500);
    }
</script>
</body>
</html>
