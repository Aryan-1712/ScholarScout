<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarScout - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-image: linear-gradient(to right, rgba(59, 130, 246, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden bg-grid">

<div class="absolute top-0 -left-4 w-72 h-72 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
<div class="absolute bottom-0 -right-4 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>

<div class="relative w-full max-w-md p-4">
    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700 p-8 rounded-3xl shadow-2xl">
        <div class="flex flex-col items-center mb-8">
            <div class="bg-gradient-to-br from-cyan-400 to-blue-600 p-3 rounded-2xl mb-4 shadow-lg shadow-cyan-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
            </div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">ScholarScout</h1>
            <p class="text-slate-400 mt-2">Find your future today.</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1 ml-1">Email Address</label>
                <input type="email" required placeholder="name@example.com"
                       class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1 ml-1">Password</label>
                <input type="password" required placeholder="••••••••"
                       class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-cyan-500 transition-colors">
            </div>

            <button type="submit"
                    class="w-full bg-cyan-500 hover:bg-cyan-400 text-white font-bold py-4 rounded-xl transition-all transform active:scale-95 shadow-lg shadow-cyan-500/20 mt-2">
                Sign In
            </button>
        </form>

        <p class="text-center text-slate-500 text-sm mt-6">
            Don't have an account? <a href="#" class="text-cyan-400 hover:underline">Sign up</a>
        </p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // Redirect to your original dashboard file
        // Make sure your dashboard file is named 'dashboard.html'
        window.location.href = "dashboard.html";
    });
</script>
</body>
</html>
