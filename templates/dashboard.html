<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarScout - Find Your Perfect Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @keyframes float-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .animate-float { animation: float-slow 6s ease-in-out infinite; }
        .animate-shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); background-size: 1000px 100%; animation: shimmer 2s infinite; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        .animate-slideIn { animation: slideIn 0.3s ease-out; }
        .scholarship-card { transition: all 0.3s ease; cursor: pointer; }
        .scholarship-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(34, 211, 238, 0.3); }
        .bg-grid { background-image: linear-gradient(to right, rgba(59, 130, 246, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(59, 130, 246, 0.05) 1px, transparent 1px); background-size: 40px 40px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 text-white min-h-screen">

<div id="loginSection" class="flex items-center justify-center min-h-screen z-[100] relative">
    <div class="bg-slate-800/80 backdrop-blur-xl p-8 rounded-3xl border border-cyan-500/30 w-full max-w-md shadow-2xl">
        <h2 class="text-3xl font-bold mb-2 text-center text-white">ScholarScout</h2>
        <p class="text-slate-400 text-center mb-8">Sign in to access your dashboard</p>
        <input type="email" id="email" placeholder="Email Address" class="w-full p-4 mb-4 bg-slate-900/50 rounded-xl border border-slate-700 outline-none focus:border-cyan-500 text-white">
        <input type="password" id="pass" placeholder="Password" class="w-full p-4 mb-6 bg-slate-900/50 rounded-xl border border-slate-700 outline-none focus:border-cyan-500 text-white">
        <button onclick="handleLogin()" class="w-full bg-cyan-500 hover:bg-cyan-400 py-4 rounded-xl font-bold text-white transition-all transform active:scale-95 shadow-lg shadow-cyan-500/20">
            Sign In
        </button>
    </div>
</div>

<div id="myDashboard" style="display: none;">

    <nav class="bg-slate-800/90 backdrop-blur-2xl border-b border-cyan-500/30 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-br from-cyan-400 to-blue-500 p-2 rounded-xl">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">ScholarScout</h1>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-3 pl-3 border-l border-slate-700">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-semibold text-white">John Doe</p>
                            <p class="text-xs text-slate-400">Student</p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 flex items-center justify-center font-bold">JD</div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex min-h-screen bg-grid">
        <aside id="sidebar" class="w-80 bg-slate-800/50 backdrop-blur-xl border-r border-cyan-500/30 p-6 overflow-y-auto scrollbar-hide">
            <div class="space-y-6">
                <div>
                    <label class="text-sm font-semibold text-cyan-300 mb-2 block">Search</label>
                    <input type="text" id="searchInput" onkeyup="filterScholarships()" placeholder="Search..." class="w-full px-4 py-3 bg-slate-900/50 border-2 border-slate-600 rounded-xl outline-none focus:border-cyan-400">
                </div>
                <button onclick="resetFilters()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-semibold transition-all">Reset Filters</button>
            </div>
        </aside>

        <main class="flex-1 p-6 overflow-y-auto">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-cyan-500/20 border border-cyan-500/30 rounded-2xl p-5">
                    <p class="text-sm text-cyan-300">Total Scholarships</p>
                    <p id="totalCount" class="text-3xl font-bold">10</p>
                </div>
            </div>
            <div id="scholarshipsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="noResults" class="hidden text-center py-20 text-slate-400">No scholarships found</div>
        </main>
    </div>
</div> <div id="scholarshipModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-slate-800 rounded-3xl max-w-3xl w-full p-8 border border-cyan-500/30" onclick="event.stopPropagation()">
        <div id="modalContent"></div>
    </div>
</div>

<script>
    const scholarships = [
        { id: 1, name: "Gates Millennium Scholars", amount: 50000, organization: "Gates Foundation", deadline: "2026-03-15", field: "All Fields" },
        { id: 2, name: "Google Engineering Scholarship", amount: 10000, organization: "Google LLC", deadline: "2026-04-20", field: "Computer Science" }
    ];

    function handleLogin() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        if (email && pass) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('myDashboard').style.display = 'block';
            init();
        } else {
            alert("Please enter credentials");
        }
    }

    function init() {
        renderScholarships();
    }

    function renderScholarships() {
        const container = document.getElementById('scholarshipsContainer');
        container.innerHTML = scholarships.map(s => `
            <div class="scholarship-card bg-slate-800/50 border border-slate-600 rounded-2xl p-6">
                <h3 class="font-bold text-xl mb-2">${s.name}</h3>
                <p class="text-cyan-400">$${s.amount.toLocaleString()}</p>
                <p class="text-sm text-slate-400 mt-2">${s.organization}</p>
            </div>
        `).join('');
    }

    function filterScholarships() { /* Add your filter logic here */ }
    function resetFilters() { document.getElementById('searchInput').value = ''; renderScholarships(); }
    function closeModal() { document.getElementById('scholarshipModal').classList.add('hidden'); }
</script>
</body>
</html>
